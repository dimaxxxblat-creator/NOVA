<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e0e10}canvas{display:block} .label{position:absolute;left:6vw;bottom:8vh;font:600 13px 'Segoe UI',sans-serif;letter-spacing:.32em;color:#8c8a8a}.label span{color:#ff7311}</style></head><body><canvas></canvas><div class="label"><span>●</span> NOVA / ДЕМО</div><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let pause=false,t=0;function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}onresize=size;size();window.wallpaperPropertyListener={setPaused:p=>pause=p};function draw(){requestAnimationFrame(draw);if(pause)return;t+=.004;const w=c.width,h=c.height;x.fillStyle='#0e0e10';x.fillRect(0,0,w,h);for(let j=0;j<11;j++){x.beginPath();for(let i=0;i<=160;i++){let a=i/160, y=h*(.49+j*.018)+Math.sin(a*6+t+j*.20)*h*.055+Math.sin(a*14-t*.5+j*.3)*h*.012;i?x.lineTo(a*w,y):x.moveTo(a*w,y)}x.strokeStyle=`rgba(255,115,17,${.08+(11-j)*.015})`;x.lineWidth=devicePixelRatio;x.stroke()}}draw();</script></body></html>
