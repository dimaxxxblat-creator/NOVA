name: Предложение
description: Предложите улучшение для NOVA
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Примеры или альтернативы
