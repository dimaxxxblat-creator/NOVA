name: Сборка и автоматические проверки
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Восстановление зависимостей
        run: dotnet restore NOVA.sln
      - name: Сборка
        run: dotnet build NOVA.sln -c Release --no-restore
      - name: Проверки Nova.Tests
        run: dotnet run --project Nova.Tests/Nova.Tests.csproj -c Release --no-build
